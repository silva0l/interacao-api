<div class="card">
  <div class="card-header">Cadastrar Cliente</div>
  <div class="card-body">
    <form (ngSubmit)="cadastrar()">
      <div class="mb-3">
        <label class="form-label">Nome</label>
        <input class="form-control" name="nome" [(ngModel)]="nome" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Endereço</label>
        <input class="form-control" name="endereco" [(ngModel)]="endereco" required />
      </div>
      <button class="btn btn-primary" type="submit">Salvar</button>
    </form>
  </div>
</div>
